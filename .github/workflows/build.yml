name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen GeminiGuard-v2.0.zip
        run: |
          set -e
          ls -la *.zip
          test -f GeminiGuard-v2.0.zip
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties _new
          unzip -q -o GeminiGuard-v2.0.zip -d _new
          cp -r _new/GeminiGuard/. .
          rm -rf _new
          echo "=== PHIEN BAN TRONG MA NGUON ==="
          grep versionName app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiGuard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
